name: the_gateway
description: Smart Waste Management App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔐 Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  # 🗄 Local Database (SQLite)
  sqflite: ^2.3.2
  path: ^1.9.0

  # 📸 Camera / Image
  image_picker: ^1.0.7

  # 🗺 OpenStreetMap (ใช้ฟรี 100%)
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # 📊 Charts / Dashboard
  fl_chart: ^0.66.2

  # 🎨 UI / Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
